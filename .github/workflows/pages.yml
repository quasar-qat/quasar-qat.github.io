# Publishes the site with GitHub Actions so that tools/ (generators, dev pages, paper text) is not served.
# Enable with Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# (With "Deploy from a branch" instead, this workflow is not needed and the whole repository is served.)
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # Only the public site repo deploys; elsewhere (e.g. a private working copy) the job is skipped, not failed.
    if: github.repository == 'quasar-qat/quasar-qat.github.io'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the public files
        run: |
          rsync -a --exclude '_site' --exclude '.git' --exclude '.github' --exclude 'tools' --exclude 'README.md' --exclude '.gitignore' ./ _site/
          for f in index.html 404.html robots.txt sitemap.xml llms.txt index.md quasar.pdf quasar.bib .nojekyll; do test -f "_site/$f" || { echo "missing $f"; exit 1; }; done
          ls _site/*.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
