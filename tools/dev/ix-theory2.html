<body>
<pre id="errs"></pre>
<script>
  // dev only: ?spacer=N pushes the figures N px down (first-view animations start offscreen)
  (function () { var n = +new URLSearchParams(location.search).get("spacer"); if (n) document.write('<div style="height:' + n + 'px"></div>'); })();
</script>
<main id="main">
<section class="block" id="theory" style="padding-top:24px">
  <div class="fig">
    <div class="grid-2">
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 15 · <b>saliency and curvature</b></span></div><div class="viz-body"><div id="ix-fig15" class="chart ix-mount" style="min-height:320px"></div></div></div>
        <figcaption><b>QUASAR's saliency tracks curvature.</b> Each point represents one weight matrix from a trained INT2 Qwen3-4B-Thinking checkpoint and compares its mean saliency <i>h</i> (Adam's second moment) with a 32-sample Hutchinson estimate of its mean Hessian diagonal. The log-scale correlation is <i>r</i>=0.81.</figcaption>
      </figure>
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 16 · <b>PL relation</b> · INT2</span></div><div class="viz-body"><div id="ix-fig16" class="chart ix-mount" style="min-height:320px"></div></div></div>
        <figcaption><b>Training trajectories support a PL relation.</b> Each point is one step of an INT2 Qwen3-4B-Thinking run, with loss and gradient measured at the reconstruction <i>r</i>. For all three methods, the squared gradient norm scales with the gap above the trajectory minimum.</figcaption>
      </figure>
    </div>
  </div>
  <div class="fig">
    <div class="grid-2">
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 17 · <b>bound terms</b> · INT2 · SGD</span></div><div class="viz-body"><div id="ix-fig17" class="chart ix-mount" style="min-height:320px"></div></div></div>
        <figcaption><b>Reconstruction error dominates the measured bound.</b> We evaluate each term of Theorem 1(i) on an INT2 QUASAR run with plain SGD and learning rate 10⁻³.</figcaption>
      </figure>
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 18 · <b>plain SGD</b> · INT2</span></div><div class="viz-body"><div id="ix-fig18" class="chart ix-mount" style="min-height:320px"></div></div></div>
        <figcaption><b>QUASAR retains its advantage under plain SGD.</b> Training (top) and held-out (bottom) loss for Standard QAT and QUASAR at INT2 across three constant learning rates. QUASAR reaches lower loss floors at every stable learning rate.</figcaption>
      </figure>
    </div>
  </div>
</section>
</main>
<script>
