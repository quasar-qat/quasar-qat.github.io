<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptation figures dev</title>
<script>
  window.__errors = [];
  window.onerror = function (msg, src, line, col) { window.__errors.push(msg + " @" + line + ":" + col); var e = document.getElementById("errs"); if (e) e.textContent = window.__errors.join("\n"); };
  window.addEventListener("unhandledrejection", function (ev) { window.__errors.push("rejection: " + ev.reason); var e = document.getElementById("errs"); if (e) e.textContent = window.__errors.join("\n"); });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap">
<link rel="stylesheet" href="../../assets/css/site.css">
<link rel="stylesheet" href="../../assets/css/ix-adapt.css">
<style>pre#errs{color:#b00;font:12px monospace;white-space:pre-wrap;margin:0 20px}</style>
</head>
<body>
<pre id="errs"></pre>
<main id="main">
<section class="block" id="adaptation" style="padding-top:24px">
  <div class="fig">
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 30 · <b>adaptation perplexity</b></span></div><div class="viz-body"><div id="ix-fig30" class="chart ix-mount" style="min-height:380px"></div></div></div>
        <figcaption><b>QUASAR reaches the lowest held-out perplexity at every bit width.</b> Training perplexity over the full run (left) and final 1,000 steps (center), and held-out perplexity (right), for QAT of Qwen3-4B-Base on OpenMathReasoning. FP-SFT is included as a full-precision reference.</figcaption>
      </figure>
  </div>
  <div class="fig">
    <div class="grid-2">
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 31 · <b>answer outcomes</b> · INT2</span></div><div class="viz-body"><div id="ix-fig31" class="chart ix-mount" style="min-height:340px"></div></div></div>
        <figcaption><b>Answer outcomes for the INT2 checkpoints.</b> Share of generated samples that produce a correct answer, an incorrect answer, or no final answer on MATH-500 and GSM8K. The base model and FP-SFT are included as references.</figcaption>
      </figure>
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 32 · <b>pass@8 / avg@1</b> · INT2</span></div><div class="viz-body"><div id="ix-fig32" class="chart ix-mount" style="min-height:340px"></div></div></div>
        <figcaption><b>Variation across repeated INT2 samples.</b> A ratio of 1 means that the same problems are solved on every attempt; higher values indicate less consistent successes. The base model and FP-SFT are included as references.</figcaption>
      </figure>
    </div>
  </div>
  <div class="fig">
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 33 · <b>divergence along traces</b></span></div><div class="viz-body"><div id="ix-fig33" class="chart ix-mount" style="min-height:340px"></div></div></div>
        <figcaption><b>Divergence from FP-SFT along reasoning traces.</b> Forward KL to FP-SFT by trace decile for selected quantized checkpoints, averaged over 1,000 MATH-500 traces generated by FP-SFT. Every checkpoint is evaluated on the same token sequences.</figcaption>
      </figure>
  </div>
  <div style="height:200px"></div>
</section>
</main>
<script>
  // dev only: headless Chrome stalls rAF under --virtual-time-budget; ?raf drives it from timers instead
  if (new URLSearchParams(location.search).has("raf")) window.requestAnimationFrame = function (cb) { return setTimeout(function () { cb(performance.now()); }, 16); };
</script>
<script src="../../assets/js/viz.js"></script>
<script src="../../assets/js/ix-adapt.js"></script>
</body>
</html>
