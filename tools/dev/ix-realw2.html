<section class="block" style="padding-top:24px">
  <div class="wide">
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 6 · <b>scale search</b> · INT3</span></div><div class="viz-body"><div id="ix-fig6" class="chart ix-mount" style="min-height:440px"></div></div></div>
        <figcaption><b>Scale search for Qwen3-4B weight groups at INT3.</b> (a) One extreme weight sets the min–max range. (b) QUASAR clips the outlier and covers the bulk. (c) Distribution of selected range factors <i>f</i>⋆ across 28.4M groups; 99.6% use a range narrower than min–max.</figcaption>
      </figure>
  </div>
  <div class="fig">
    <div class="grid-2">
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 7 · <b>selected clipping-range factors</b></span></div><div class="viz-body"><div id="ix-fig7" class="chart ix-mount" style="min-height:360px"></div></div></div>
        <figcaption><b>Distribution of selected clipping-range factors <i>f</i>⋆ across weight groups after QAD at INT4, INT3, and INT2 for Qwen3-4B-Thinking-2507 and Llama-3.1-8B-Instruct.</b> Lower bit widths favor narrower ranges.</figcaption>
      </figure>
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 8 · <b>saliency in one layer</b></span></div><div class="viz-body"><div class="chart" style="min-height:420px"></div></div></div>
        <figcaption>(placeholder for the paired card)</figcaption>
      </figure>
    </div>
  </div>
  <div class="fig">
      <figure class="plate ix">
        <div class="viz"><div class="viz-head"><span class="viz-kicker" data-label>Fig. 11 · <b>reduction across projection types</b></span></div><div class="viz-body"><div id="ix-fig11" class="chart ix-mount" style="min-height:360px"></div></div></div>
        <figcaption><b>QUASAR reduces reconstruction error across projection types.</b> Median reduction in loss-aware reconstruction error relative to Standard QAT across Qwen3-4B-Thinking-2507 modules at INT4, INT3, and INT2, measured at initialization (left) and after training (right). Error is measured against the full-precision weights.</figcaption>
      </figure>
